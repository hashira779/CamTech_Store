name: Deploy to Production (Ubuntu 10.1.0.11)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Safe Production Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          # Prune stopped containers from previous runs
          sudo docker container prune -f 2>/dev/null || true
          # Prune dangling unused container images
          sudo docker image prune -f 2>/dev/null || true
          # Clean old runner diagnostic logs older than 2 days
          find ~/actions-runner*/_diag -name "*.log" -mtime +2 -delete 2>/dev/null || true
          # Vacuum system logs
          sudo journalctl --vacuum-time=2d 2>/dev/null || true
          echo "✅ Disk optimization complete"
          df -h /

      - name: Make Scripts Executable
        run: |
          chmod +x ./scripts/deploy_production.sh
          chmod +x ./scripts/*.py 2>/dev/null || true

      - name: Safe Deploy with Automated Rollback
        run: ./scripts/deploy_production.sh

      - name: Notify Telegram on Deployment Ready
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot8745615258:AAFadixBs9plxXhPVv_RlixfdnpWtAZf2SA/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "7673456476",
              "text": "🎉 *MyStore CI/CD Deployment Ready in Production!*\n\n• *Server:* `10.1.0.11`\n• *Branch:* `${{ github.ref_name }}`\n• *Commit:* `${{ github.sha }}`\n• *Triggered By:* `${{ github.actor }}`\n• *Admin Console:* https://admin.camtech.cam\n• *Alt Console:* https://adminconsol.camtech.cam\n• *Status:* ✅ All services live & healthy",
              "parse_mode": "Markdown"
            }' || true

      - name: Notify Telegram on Deployment Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot8745615258:AAFadixBs9plxXhPVv_RlixfdnpWtAZf2SA/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "7673456476",
              "text": "❌ *MyStore CI/CD Deployment FAILED!*\n\n• *Server:* `10.1.0.11`\n• *Branch:* `${{ github.ref_name }}`\n• *Commit:* `${{ github.sha }}`\n• *Triggered By:* `${{ github.actor }}`\n• *Status:* ⚠️ Rollback initiated on production server",
              "parse_mode": "Markdown"
            }' || true
