name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-backend:
    name: Python Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: camtech
          POSTGRES_PASSWORD: camtech123
          POSTGRES_DB: camtechStore
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: services/backend-py

    env:
      DATABASE_URL: postgresql+asyncpg://camtech:camtech123@127.0.0.1:5433/camtechStore
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: mystore_ci_testing_secret_key_2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Database Connectivity
        run: |
          python -c "import asyncio, asyncpg; asyncio.run(asyncpg.connect('postgresql://camtech:camtech123@127.0.0.1:5433/camtechStore'))"

      - name: Every Module Imports Check (Feature Architecture Gate)
        run: |
          # Ensures no module contains syntax or circular import errors at the top level
          python -c "from app.models.entities import *; import app.main; import app.microservices.gateway"

      - name: Run Pytest Test Suite
        id: pytest_run
        run: |
          python -m pytest -v --tb=short tests 2>&1 | tee pytest_output.log

      - name: Report Pytest Diagnostics on Failure
        if: failure() && steps.pytest_run.outcome == 'failure'
        run: |
          echo "## ❌ Pytest Test Suite Failure Trace" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 pytest_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Schema Drift Audit (Database Architecture Gate)
        run: |
          # Fails the build if SQLAlchemy models drift from the live database
          python scripts/schema_audit.py

  typescript-monorepo:
    name: TypeScript Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Contracts
        run: pnpm --filter @mystore/contracts build

      - name: Typecheck
        run: pnpm typecheck

  e2e-playwright:
    name: Playwright E2E Regression Suite
    runs-on: ubuntu-latest
    needs: [typescript-monorepo]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Contracts
        run: pnpm --filter @mystore/contracts build

      - name: Build Web App
        run: pnpm --filter @mystore/web build

      - name: Install Playwright Browsers
        run: pnpm --filter @mystore/web exec playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: pnpm --filter @mystore/web test:e2e
        continue-on-error: true
        env:
          CI: 'true'

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  deploy-production:
    name: Safe Production Deploy
    runs-on: self-hosted
    needs: [python-backend, typescript-monorepo]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          # Prune stopped containers from previous runs
          sudo docker container prune -f 2>/dev/null || true
          # Prune dangling unused container images
          sudo docker image prune -f 2>/dev/null || true
          # Clean old runner diagnostic logs older than 2 days
          find ~/actions-runner*/_diag -name "*.log" -mtime +2 -delete 2>/dev/null || true
          # Vacuum system logs
          sudo journalctl --vacuum-time=2d 2>/dev/null || true
          echo "✅ Disk optimization complete"
          df -h /

      - name: Inject Production .env
        run: |
          if [ -f /home/ubuntu-server/CamTech_Store/.env ]; then
            echo "🔒 Using active production .env from /home/ubuntu-server/CamTech_Store/.env"
            cp /home/ubuntu-server/CamTech_Store/.env .env
          elif [ -n "${{ secrets.ENV_PRODUCTION }}" ]; then
            echo "${{ secrets.ENV_PRODUCTION }}" > .env
            echo "✅ Successfully injected production .env from GitHub Secrets."
          else
            echo "⚠️ ENV_PRODUCTION secret is missing! Using existing .env on server if it exists."
          fi

      - name: Make Scripts Executable
        run: |
          chmod +x ./scripts/deploy_production.sh
          chmod +x ./scripts/*.py 2>/dev/null || true

      - name: Safe Deploy with Automated Rollback
        run: ./scripts/deploy_production.sh

      - name: Notify Telegram on Deployment Ready
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "7673456476",
              "text": "🎉 *MyStore CI/CD Deployment Ready in Production!*\n\n• *Server:* `10.1.0.11`\n• *Branch:* `${{ github.ref_name }}`\n• *Commit:* `${{ github.sha }}`\n• *Triggered By:* `${{ github.actor }}`\n• *Admin Console:* https://admin.camtech.cam\n• *Alt Console:* https://adminconsol.camtech.cam\n• *Status:* ✅ All services live & healthy",
              "parse_mode": "Markdown"
            }' || true

      - name: Notify Telegram on Deployment Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "7673456476",
              "text": "❌ *MyStore CI/CD Deployment FAILED!*\n\n• *Server:* `10.1.0.11`\n• *Branch:* `${{ github.ref_name }}`\n• *Commit:* `${{ github.sha }}`\n• *Triggered By:* `${{ github.actor }}`\n• *Status:* ⚠️ Rollback initiated on production server",
              "parse_mode": "Markdown"
            }' || true

  notify-telegram:
    name: Telegram CI Pipeline Notification
    runs-on: ubuntu-latest
    needs: [python-backend, typescript-monorepo, e2e-playwright, deploy-production]
    if: always()
    steps:
      - name: Send CI/CD Pipeline Summary
        run: |
          STATUS="${{ (contains(needs.python-backend.result, 'failure') || contains(needs.typescript-monorepo.result, 'failure') || contains(needs.e2e-playwright.result, 'failure') || contains(needs.deploy-production.result, 'failure')) && 'FAILED ❌' || 'PASSED ✅' }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"7673456476\",
              \"text\": \"🧪 *MyStore CI/CD Pipeline: ${STATUS}*\n\n• *Commit:* \`${{ github.sha }}\`\n• *Branch:* \`${{ github.ref_name }}\`\n• *Actor:* \`${{ github.actor }}\`\n• *Backend Tests:* \`${{ needs.python-backend.result }}\`\n• *Typescript Build:* \`${{ needs.typescript-monorepo.result }}\`\n• *E2E Playwright:* \`${{ needs.e2e-playwright.result }}\`\n• *Production Deploy:* \`${{ needs.deploy-production.result }}\`\",
              \"parse_mode\": \"Markdown\"
            }" || true
