name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-backend:
    name: Python Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: camtech
          POSTGRES_PASSWORD: camtech123
          POSTGRES_DB: camtechStore
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: services/backend-py

    env:
      DATABASE_URL: postgresql+asyncpg://camtech:camtech123@127.0.0.1:5433/camtechStore
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: mystore_ci_testing_secret_key_2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Database Connectivity
        run: |
          python -c "import asyncio, asyncpg; asyncio.run(asyncpg.connect('postgresql://camtech:camtech123@127.0.0.1:5433/camtechStore'))"

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v --tb=short tests

  typescript-monorepo:
    name: TypeScript Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Contracts
        run: pnpm --filter @mystore/contracts build

      - name: Typecheck
        run: pnpm typecheck
