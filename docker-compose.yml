version: '3.8'

# MyStore Enterprise Platform — Development Infrastructure
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: mystore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mystore
      POSTGRES_PASSWORD: mystore_dev
      POSTGRES_DB: mystore
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mystore']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mystore-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mystore-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mystore
      MINIO_ROOT_PASSWORD: mystore_dev
    ports:
      - '9000:9000'   # API
      - '9001:9001'   # Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
