      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - '${MINI_PORT_HOST:-5007}:80'
    networks:
      - mystore-net

  # ── MAIN EDGE REVERSE PROXY (PORT 80 & 443) ──────────────────────────────────
  nginx-ingress:
    image: nginx:1.27-alpine
    container_name: mystore-nginx-ingress
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - '${INGRESS_PORT_HOST:-8090}:80'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - store-app
      - admin-app
      - pos-app
      - delivery-app
      - hr-app
      - ceo-app
      - infra-app
      - mini-app
    networks:
      - mystore-net

  # ── CLOUDFLARE ZERO TRUST SECURE TUNNEL ──────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mystore-cloudflared
    restart: always
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx-ingress

volumes:
  pgdata:
  pgreplicadata:
  redisdata:

networks:
  mystore-net:
    driver: bridge
  camtech-net:
    external: true
    name: camtech_camtech-net
