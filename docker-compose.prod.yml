version: '3.8'

# ==============================================================================
# MyStore Production Enterprise Stack — Ubuntu Server (10.1.0.11)
# High Availability, Fault-Isolated Containers, Multi-Worker Microservices
# ==============================================================================

services:
  # ── CENTRAL PERSISTENCE (POSTGRESQL 16) ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mystore-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-camtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camtech123}
      POSTGRES_DB: ${POSTGRES_DB:-camtechStore}
    ports:
      - '${POSTGRES_PORT_HOST:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-camtech} -d ${POSTGRES_DB:-camtechStore}']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mystore-net

  # ── EVENT QUEUE & ASYNC OUTBOX BROKER (REDIS 7) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mystore-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:${REDIS_PORT_HOST:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mystore-net

  # ── EDGE API GATEWAY (PORT 4000) ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/backend-py
      dockerfile: Dockerfile
    container_name: mystore-api-gateway
    restart: always
    command: python -m uvicorn app.microservices.gateway:gateway --host 0.0.0.0 --port 4000 --workers 4
    ports:
      - '${API_GATEWAY_PORT_HOST:-4010}:4000'
    security_opt:
      - no-new-privileges:true
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-camtech}:${POSTGRES_PASSWORD:-camtech123}@postgres:5432/${POSTGRES_DB:-camtechStore}
      - JWT_SECRET=${JWT_SECRET:-mystore_super_secret_jwt_key_2026_enterprise_standard}
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:4001
      - CATALOG_SERVICE_URL=http://catalog-service:4002
      - SALES_SERVICE_URL=http://sales-service:4003
      - DELIVERY_SERVICE_URL=http://delivery-service:4004
      - HR_SERVICE_URL=http://hr-service:4005
      - FINANCE_SERVICE_URL=http://finance-service:4006
      - PLATFORM_SERVICE_URL=http://platform-service:4007
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mystore-net

  # ── BACKEND MICROSERVICES (PORTS 4001 - 4007) ────────────────────────────────
  auth-service:
    build:
      context: ./services/backend-py
      dockerfile: Dockerfile
    container_name: mystore-auth-service
    restart: always
    command: python -m uvicorn app.microservices.auth_service:app --host 0.0.0.0 --port 4001 --workers 2
    ports:
      - '127.0.0.1:4001:4001'
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-camtech}:${POSTGRES_PASSWORD:-camtech123}@postgres:5432/${POSTGRES_DB:-camtechStore}
      - JWT_SECRET=${JWT_SECRET:-mystore_super_secret_jwt_key_2026_enterprise_standard}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mystore-net

  catalog-service:
    build:
      context: ./services/backend-py
      dockerfile: Dockerfile
    container_name: mystore-catalog-service
    restart: always
    command: python -m uvicorn app.microservices.catalog_service:app --host 0.0.0.0 --port 4002 --workers 2
    ports:
      - '127.0.0.1:4002:4002'
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-camtech}:${POSTGRES_PASSWORD:-camtech123}@postgres:5432/${POSTGRES_DB:-camtechStore}
      - JWT_SECRET=${JWT_SECRET:-mystore_super_secret_jwt_key_2026_enterprise_standard}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mystore-net

  sales-service:
    build:
      context: ./services/backend-py
      dockerfile: Dockerfile
    container_name: mystore-sales-service
    restart: always
    command: python -m uvicorn app.microservices.sales_service:app --host 0.0.0.0 --port 4003 --workers 2
    ports:
      - '127.0.0.1:4003:4003'
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-camtech}:${POSTGRES_PASSWORD:-camtech123}@postgres:5432/${POSTGRES_DB:-camtechStore}
      - JWT_SECRET=${JWT_SECRET:-mystore_super_secret_jwt_key_2026_enterprise_standard}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mystore-net

  delivery-service:
    build:
      context: ./services/backend-py
      dockerfile: Dockerfile
    container_name: mystore-delivery-service
    restart: always
    command: python -m uvicorn app.microservices.delivery_service:app --host 0.0.0.0 --port 4004 --workers 2
    ports:
      - '127.0.0.1:4004:4004'
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-camtech}:${POSTGRES_PASSWORD:-camtech123}@postgres:5432/${POSTGRES_DB:-camtechStore}
      - JWT_SECRET=${JWT_SECRET:-mystore_super_secret_jwt_key_2026_enterprise_standard}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mystore-net

  hr-service:
    build:
      context: ./services/backend-py
      dockerfile: Dockerfile
    container_name: mystore-hr-service
    restart: always
    command: python -m uvicorn app.microservices.hr_service:app --host 0.0.0.0 --port 4005 --workers 2
    ports:
      - '127.0.0.1:4005:4005'
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-camtech}:${POSTGRES_PASSWORD:-camtech123}@postgres:5432/${POSTGRES_DB:-camtechStore}
      - JWT_SECRET=${JWT_SECRET:-mystore_super_secret_jwt_key_2026_enterprise_standard}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mystore-net

  finance-service:
    build:
      context: ./services/backend-py
      dockerfile: Dockerfile
    container_name: mystore-finance-service
    restart: always
    command: python -m uvicorn app.microservices.finance_service:app --host 0.0.0.0 --port 4006 --workers 2
    ports:
      - '127.0.0.1:4006:4006'
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-camtech}:${POSTGRES_PASSWORD:-camtech123}@postgres:5432/${POSTGRES_DB:-camtechStore}
      - JWT_SECRET=${JWT_SECRET:-mystore_super_secret_jwt_key_2026_enterprise_standard}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mystore-net

  platform-service:
    build:
      context: ./services/backend-py
      dockerfile: Dockerfile
    container_name: mystore-platform-service
    restart: always
    command: python -m uvicorn app.microservices.platform_service:app --host 0.0.0.0 --port 4007 --workers 2
    ports:
      - '127.0.0.1:4007:4007'
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-camtech}:${POSTGRES_PASSWORD:-camtech123}@postgres:5432/${POSTGRES_DB:-camtechStore}
      - JWT_SECRET=${JWT_SECRET:-mystore_super_secret_jwt_key_2026_enterprise_standard}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mystore-net

  # ── PRODUCTION COMPILED FRONTEND CONTAINERS (LIGHTWEIGHT NGINX) ──────────────
  store-app:
    build:
      context: .
      dockerfile: apps/Dockerfile.prod
      target: store-app
    container_name: mystore-store-app
    restart: always
    ports:
      - '${STORE_PORT_HOST:-5001}:80'
    networks:
      - mystore-net

  admin-app:
    build:
      context: .
      dockerfile: apps/Dockerfile.prod
      target: admin-app
    container_name: mystore-admin-app
    restart: always
    ports:
      - '${ADMIN_PORT_HOST:-5002}:80'
    networks:
      - mystore-net

  pos-app:
    build:
      context: .
      dockerfile: apps/Dockerfile.prod
      target: pos-app
    container_name: mystore-pos-app
    restart: always
    ports:
      - '${POS_PORT_HOST:-5003}:80'
    networks:
      - mystore-net

  delivery-app:
    build:
      context: .
      dockerfile: apps/Dockerfile.prod
      target: delivery-app
    container_name: mystore-delivery-app
    restart: always
    ports:
      - '${DELIVERY_PORT_HOST:-5004}:80'
    networks:
      - mystore-net

  hr-app:
    build:
      context: .
      dockerfile: apps/Dockerfile.prod
      target: hr-app
    container_name: mystore-hr-app
    restart: always
    ports:
      - '${HR_PORT_HOST:-5005}:80'
    networks:
      - mystore-net

  ceo-app:
    build:
      context: .
      dockerfile: apps/Dockerfile.prod
      target: ceo-app
    container_name: mystore-ceo-app
    restart: always
    ports:
      - '${CEO_PORT_HOST:-5008}:80'
    networks:
      - mystore-net

  # ── MAIN EDGE REVERSE PROXY (PORT 80 & 443) ──────────────────────────────────
  nginx-ingress:
    image: nginx:1.27-alpine
    container_name: mystore-nginx-ingress
    restart: always
    ports:
      - '${INGRESS_PORT_HOST:-8090}:80'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - store-app
      - admin-app
      - pos-app
      - delivery-app
      - hr-app
      - ceo-app
    networks:
      - mystore-net

  # ── CLOUDFLARE ZERO TRUST SECURE TUNNEL ──────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mystore-cloudflared
    restart: always
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-eyJhIjoiYTZkNTM1YTYzOWY3ZTk5ZjJlNDkzNGNmZjQ3ZGUyODgiLCJ0IjoiODg2ODgwYTktMWUwYi00ZTAzLThkYTAtNDRiOWVjYmZmOGIwIiwicyI6Ik5XUmlOamd5TWpJdFlXTTJaQzAwTXpBeExUazNNVGN0Wm1KaE1qRXlOek0xTlRJNCJ9}
    depends_on:
      - nginx-ingress

volumes:
  pgdata:
  redisdata:

networks:
  mystore-net:
    driver: bridge
