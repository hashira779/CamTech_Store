version: '3.8'

# ==============================================================================
# MyStore Production Enterprise Stack — Ubuntu Server (10.1.0.11)
# High Availability, Fault-Isolated Containers, Multi-Worker Microservices
# ==============================================================================

services:
  # ── CENTRAL PERSISTENCE (POSTGRESQL 16) ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mystore-postgres
    restart: always
    # Must stay above the sum of every process's pool; tests/test_deploy_config.py checks it.
    command: ['postgres', '-c', 'max_connections=200']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-camtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-camtechStore}
    ports:
      - '${DATA_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT_HOST:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-camtech} -d ${POSTGRES_DB:-camtechStore}']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mystore-net

  # ── DATABASE READ REPLICA (POSTGRESQL 16) ───────────────────────────────────
  postgres-replica:
    image: postgres:16-alpine
    container_name: mystore-postgres-replica
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-camtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-camtechStore}
      PGUSER: ${POSTGRES_USER:-camtech}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '${DATA_BIND_HOST:-127.0.0.1}:${POSTGRES_REPLICA_PORT_HOST:-5434}:5432'
    volumes:
      - pgreplicadata:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mystore-net

  # ── EVENT QUEUE & ASYNC OUTBOX BROKER (REDIS 7) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mystore-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:${REDIS_PORT_HOST:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mystore-net

  # ── CONNECTION POOLING (PGBOUNCER) ──────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: mystore-pgbouncer
    restart: always
    environment:
      - DB_USER=${POSTGRES_USER:-camtech}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-camtechStore}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=100
      - RESERVE_POOL_SIZE=20
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
    ports:
      - '${DATA_BIND_HOST:-127.0.0.1}:6432:6432'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mystore-net

  # ── DISTRIBUTED TELEMETRY & TRACING (OPENTELEMETRY & JAEGER) ────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: mystore-otel-collector
    restart: always
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/telemetry/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - '${DATA_BIND_HOST:-127.0.0.1}:4317:4317'
      - '${DATA_BIND_HOST:-127.0.0.1}:4318:4318'
    networks:
      - mystore-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: mystore-jaeger
    restart: always
    ports:
      - '${DATA_BIND_HOST:-127.0.0.1}:16686:16686'
    networks:
      - mystore-net

  # ── EDGE API GATEWAY (PORT 4000) ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/backend-py
      dockerfile: Dockerfile
    container_name: mystore-api-gateway
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    command: python -m uvicorn app.microservices.gateway:gateway --host 0.0.0.0 --port 4000 --workers ${GATEWAY_WORKERS:-4}
    ports:
      - '${API_GATEWAY_PORT_HOST:-4010}:4000'
    security_opt:
      - no-new-privileges:true
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-camtech}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-camtechStore}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=${DB_POOL_SIZE:-6}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-4}
      - AUTH_SERVICE_URL=http://auth-service:4001
      - CATALOG_SERVICE_URL=http://catalog-service:4002
      - SALES_SERVICE_URL=http://sales-service:4003
      - DELIVERY_SERVICE_URL=http://delivery-service:4004
      - HR_SERVICE_URL=http://hr-service:4005
      - FINANCE_SERVICE_URL=http://finance-service:4006
      - PLATFORM_SERVICE_URL=http://platform-service:4007
      - BOT_BUILDER_SERVICE_URL=http://bot-builder-service:4008
      - INFRA_SERVICE_URL=http://infra-service:4009
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mystore-net

  # ── BACKEND MICROSERVICES (PORTS 4001 - 4007) ────────────────────────────────
