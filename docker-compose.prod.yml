  # ── TELEGRAM MINI APP STOREFRONT (DEDICATED CONTAINER · PORT 5007) ──────────
  mini-app:
    build:
      context: .
      dockerfile: apps/Dockerfile.prod
      target: mini-app
    container_name: mystore-mini-app
    restart: always
