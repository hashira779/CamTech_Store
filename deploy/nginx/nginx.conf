events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Rate Limiting & Connection Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream Definitions
    upstream api_gateway {
        server api-gateway:4000;
        keepalive 32;
    }

    upstream store_app {
        server store-app:80;
    }

    upstream admin_app {
        server admin-app:80;
    }

    upstream pos_app {
        server pos-app:80;
    }

    upstream delivery_app {
        server delivery-app:80;
    }

    upstream hr_app {
        server hr-app:80;
    }

    upstream ceo_app {
        server ceo-app:80;
    }

    # -------------------------------------------------------------
    # Main HTTP Server (Port 80)
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        server_tokens off;

        # Mitigate HTTP Flood & Slowloris attacks
        limit_conn conn_limit 50;

        # Block unauthorized HTTP methods
        if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$ ) {
            return 405;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

        # Block hidden files, git directories, and environment files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # 1a. Strict Auth Rate Limiting (/api/v1/auth/)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 1b. API Gateway Route (/api/v1/)
        location /api/v1/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / SSE support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Subdomain Matching: pos.*
        # 2. Subdomain Matching: pos.*
        if ($host ~* ^(pos|cashier)\.) {
            rewrite ^(.*)$ /pos-proxy$1 last;
        }

        # 3. Storefront: store.*, shop.*, or root domain camtech.cam
        if ($host ~* (store\.|shop\.|camtech\.cam$)) {
            rewrite ^(.*)$ /store-proxy$1 last;
        }

        # 4. Subdomain Matching: delivery.* or driver.*
        if ($host ~* ^(delivery|driver)\.) {
            rewrite ^(.*)$ /delivery-proxy$1 last;
        }

        # 5. Subdomain Matching: hr.*
        if ($host ~* ^hr\.) {
            rewrite ^(.*)$ /hr-proxy$1 last;
        }

        # 6. Subdomain Matching: ceo.*
        if ($host ~* ^ceo\.) {
            rewrite ^(.*)$ /ceo-proxy$1 last;
        }

        # 7. Subdomain Matching: api.*
        if ($host ~* ^api\.) {
            rewrite ^(.*)$ /api-proxy$1 last;
        }

        # Internal Subdomain Rewrites
        location /pos-proxy/ {
            internal;
            rewrite ^/pos-proxy/(.*)$ /$1 break;
            proxy_pass http://pos_app;
            proxy_set_header Host $host;
        }

        location /store-proxy/ {
            internal;
            rewrite ^/store-proxy/(.*)$ /$1 break;
            proxy_pass http://store_app;
            proxy_set_header Host $host;
        }

        location /delivery-proxy/ {
            internal;
            rewrite ^/delivery-proxy/(.*)$ /$1 break;
            proxy_pass http://delivery_app;
            proxy_set_header Host $host;
        }

        location /hr-proxy/ {
            internal;
            rewrite ^/hr-proxy/(.*)$ /$1 break;
            proxy_pass http://hr_app;
            proxy_set_header Host $host;
        }

        location /ceo-proxy/ {
            internal;
            rewrite ^/ceo-proxy/(.*)$ /$1 break;
            proxy_pass http://ceo_app;
            proxy_set_header Host $host;
        }

        location /api-proxy/ {
            internal;
            rewrite ^/api-proxy/(.*)$ /$1 break;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Default: Enterprise Web / Admin SPA
        location / {
            proxy_pass http://admin_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
