events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream Definitions
    upstream api_gateway {
        server api-gateway:4000;
        keepalive 32;
    }

    upstream store_app {
        server store-app:80;
    }

    upstream admin_app {
        server admin-app:80;
    }

    upstream pos_app {
        server pos-app:80;
    }

    upstream delivery_app {
        server delivery-app:80;
    }

    upstream hr_app {
        server hr-app:80;
    }

    upstream ceo_app {
        server ceo-app:80;
    }

    # -------------------------------------------------------------
    # Main HTTP Server (Port 80)
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        server_tokens off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. API Gateway Route (/api/v1/)
        location /api/v1/ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / SSE support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Subdomain Matching: pos.*
        if ($host ~* ^(pos|cashier)\.) {
            rewrite ^(.*)$ /pos-proxy$1 last;
        }

        # 3. Subdomain Matching: store.* or shop.*
        if ($host ~* ^(store|shop)\.) {
            rewrite ^(.*)$ /store-proxy$1 last;
        }

        # 4. Subdomain Matching: delivery.* or driver.*
        if ($host ~* ^(delivery|driver)\.) {
            rewrite ^(.*)$ /delivery-proxy$1 last;
        }

        # 5. Subdomain Matching: hr.*
        if ($host ~* ^hr\.) {
            rewrite ^(.*)$ /hr-proxy$1 last;
        }

        # 6. Subdomain Matching: ceo.*
        if ($host ~* ^ceo\.) {
            rewrite ^(.*)$ /ceo-proxy$1 last;
        }

        # Internal Subdomain Rewrites
        location /pos-proxy/ {
            internal;
            rewrite ^/pos-proxy/(.*)$ /$1 break;
            proxy_pass http://pos_app;
            proxy_set_header Host $host;
        }

        location /store-proxy/ {
            internal;
            rewrite ^/store-proxy/(.*)$ /$1 break;
            proxy_pass http://store_app;
            proxy_set_header Host $host;
        }

        location /delivery-proxy/ {
            internal;
            rewrite ^/delivery-proxy/(.*)$ /$1 break;
            proxy_pass http://delivery_app;
            proxy_set_header Host $host;
        }

        location /hr-proxy/ {
            internal;
            rewrite ^/hr-proxy/(.*)$ /$1 break;
            proxy_pass http://hr_app;
            proxy_set_header Host $host;
        }

        location /ceo-proxy/ {
            internal;
            rewrite ^/ceo-proxy/(.*)$ /$1 break;
            proxy_pass http://ceo_app;
            proxy_set_header Host $host;
        }

        # Default: Enterprise Web / Admin SPA
        location / {
            proxy_pass http://admin_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
