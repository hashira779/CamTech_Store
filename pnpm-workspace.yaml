packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# Allow only the postinstall build scripts we actually need (pnpm 11 blocks
# arbitrary build scripts by default for supply-chain safety, spec §66/§107).
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  "@scarf/scarf": false
  esbuild: true

overrides:
  "@nestjs/core": ">=11.1.18"
  lodash: ">=4.18.1"
  glob: ">=12.0.0"
  multer: ">=2.3.0"
  deepmerge-ts: ">=8.0.0"
  tmp: ">=0.2.6"
  js-yaml: ">=4.3.1"
  picomatch: ">=4.0.4"
  qs: ">=6.16.0"
  ajv: ">=8.18.0"
  file-type: ">=21.3.2"
  webpack: ">=5.104.1"
  body-parser: ">=1.20.6"

