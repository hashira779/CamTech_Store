apiVersion: apps/v1
kind: Deployment
metadata:
  name: mystore-sales-service
  namespace: mystore
  labels:
    app: mystore-sales-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mystore-sales-service
  template:
    metadata:
      labels:
        app: mystore-sales-service
    spec:
      containers:
        - name: sales-service
          image: mystore/backend-py:latest
          command: ["python", "-m", "uvicorn", "app.microservices.sales_service:app", "--host", "0.0.0.0", "--port", "4003"]
          ports:
            - containerPort: 4003
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sales-service
  namespace: mystore
spec:
  selector:
    app: mystore-sales-service
  ports:
    - port: 4003
      targetPort: 4003
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mystore-sales-service-hpa
  namespace: mystore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mystore-sales-service
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
